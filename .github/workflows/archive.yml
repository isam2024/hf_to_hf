name: Archive Civitai LoRAs

on:
  # Cron disabled while HF rate-limit cools down after super_squash on 2026-06-05.
  # Each failed cron PUTs bytes via preupload before bailing, which creates more
  # orphans and keeps the throttle engaged. Re-enable once dispatch runs succeed.
  # schedule:
  #   - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:        # allow manual runs from the Actions tab
    inputs:
      mode:
        description: "new (recent only), backfill (descend windows), or heal (gap-fill swept range)"
        required: false
        type: choice
        options: [new, backfill, heal]
        default: new
      base_models:
        description: "Comma-separated Civitai base models"
        required: false
      max_files:
        description: "Max files to archive this run"
        required: false

concurrency:
  group: civitai-archive
  cancel-in-progress: false   # never interrupt an in-flight crawl

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # under GitHub's 6h ceiling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run crawler
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CIVITAI_API_KEY: ${{ secrets.CIVITAI_API_KEY }}
          ARCHIVE_REPO: ${{ vars.ARCHIVE_REPO || 'isam/civitai-lora-archive' }}
          BASE_MODELS: ${{ github.event.inputs.base_models || vars.BASE_MODELS || 'Flux.1 D' }}
          MAX_FILES_PER_RUN: ${{ github.event.inputs.max_files || vars.MAX_FILES_PER_RUN || '0' }}
          MAX_FILE_MB: ${{ vars.MAX_FILE_MB || '0' }}
          MODE: ${{ github.event.inputs.mode || 'new' }}
          SINCE_DAYS: ${{ vars.SINCE_DAYS || '2' }}
        run: python crawler.py

      - name: Backup manifest + skiplist to GH
        if: success()
        env:
          ARCHIVE_REPO: ${{ vars.ARCHIVE_REPO || 'isam/civitai-lora-archive' }}
        run: |
          mkdir -p backups
          curl -sLf "https://huggingface.co/${ARCHIVE_REPO}/resolve/main/manifest.json" -o backups/manifest.json
          curl -sLf "https://huggingface.co/${ARCHIVE_REPO}/resolve/main/skiplist.json" -o backups/skiplist.json || true
          curl -sLf "https://huggingface.co/${ARCHIVE_REPO}/resolve/main/backfill_state.json" -o backups/backfill_state.json || true
          git config user.email "actions@github.com"
          git config user.name "gh-actions"
          git add backups/
          git diff --cached --quiet || git commit -m "Backup manifest after run ${GITHUB_RUN_ID}"
          git push || true
